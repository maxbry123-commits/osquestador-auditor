<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Archivos</title>
<style>
:root { --bg-0:#000; --bg-1:#0a0a0a; --bg-2:#141414; --bg-3:#1a1a1a; --border:#2e2e2e; --text-1:#fff; --text-2:#b0aea5; --text-3:#9ca3af; --text-4:#6b7280; --icon:#b0aea5; --accent:#3b82f6; --focus-ring:#3898ec; --font-display:'Charter',Georgia,serif; --font-body:system-ui,sans-serif; --font-mono:'JetBrains Mono',Menlo,monospace; }
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
html,body { overflow-x:hidden; }
body { font-family:var(--font-body); font-size:14px; line-height:1.5; color:var(--text-1); background:var(--bg-0); -webkit-font-smoothing:antialiased; min-height:100vh; }
.serif { font-family:var(--font-display); }
.mono { font-family:var(--font-mono); }
*:focus-visible { outline:2px solid var(--focus-ring); outline-offset:2px; border-radius:3px; }
.icon { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
.icon-sm { width:12px; height:12px; }

.app { display:flex; flex-direction:column; min-height:100vh; }
.header { position:sticky; top:0; z-index:50; background:var(--bg-1); border-bottom:1px solid var(--border); padding:8px 12px; min-height:56px; display:flex; align-items:center; gap:8px; }
.back-link { display:inline-flex; align-items:center; gap:6px; color:var(--text-3); font-size:12px; text-decoration:none; padding:6px 10px; border:1px solid var(--border); border-radius:6px; min-height:36px; }
.title { font-family:var(--font-display); font-size:clamp(1rem, 4vw, 1.25rem); flex:1; min-width:0; }
.btn-icon { background:transparent; border:1px solid var(--border); color:var(--icon); width:36px; height:36px; border-radius:6px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }

.toolbar { padding:8px 12px; background:var(--bg-1); border-bottom:1px solid var(--border); display:flex; gap:8px; align-items:center; }
.search { flex:1; background:var(--bg-2); border:1px solid var(--border); border-radius:6px; padding:6px 10px; display:flex; align-items:center; gap:6px; min-height:36px; }
.search input { background:transparent; border:none; color:var(--text-1); flex:1; outline:none; font-size:12px; min-width:0; }
.search input::placeholder { color:var(--text-4); }

.list { flex:1; padding:8px 12px; }
.file-row { display:flex; align-items:center; gap:10px; padding:10px; background:var(--bg-1); border:1px solid var(--border); border-radius:8px; margin-bottom:6px; min-height:56px; cursor:pointer; }
.file-row.selected { background:rgba(59,130,246,0.1); border-color:var(--accent); border-left-width:3px; }
.check { width:18px; height:18px; border:1px solid var(--border); border-radius:4px; background:var(--bg-2); display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
.file-row.selected .check { background:var(--accent); border-color:var(--accent); }
.file-row.selected .check::after { content:"✓"; color:#fff; font-size:12px; }
.thumb { width:36px; height:36px; border-radius:6px; background:var(--bg-2); display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
.info { flex:1; min-width:0; }
.name { font-size:13px; color:var(--text-1); font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.meta { font-size:11px; color:var(--text-3); margin-top:2px; display:flex; gap:6px; flex-wrap:wrap; }
.tag { font-size:10px; padding:1px 6px; background:var(--bg-3); border-radius:3px; color:var(--text-2); font-family:var(--font-mono); }
.act { display:flex; gap:4px; }
.act-btn { background:transparent; border:none; color:var(--text-4); width:32px; height:32px; border-radius:4px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
.act-btn:hover { background:var(--bg-3); color:var(--text-1); }

.footer { position:sticky; bottom:0; background:var(--bg-1); border-top:1px solid var(--border); padding:8px 12px; display:flex; gap:6px; align-items:center; min-height:56px; flex-wrap:wrap; }
.f-count { font-size:12px; color:var(--text-3); flex:1; min-width:0; }
.f-count strong { color:var(--text-1); }
.f-btn { display:inline-flex; align-items:center; gap:4px; padding:8px 10px; background:var(--bg-2); border:1px solid var(--border); border-radius:6px; cursor:pointer; font-size:11px; min-height:36px; }
.f-btn:hover { background:var(--bg-3); }
.f-btn strong { color:var(--text-1); }
</style>
</head>
<body>
<div class="app">
  <header class="header" role="banner">
    <a href="00_main_dashboard.html" class="back-link" aria-label="Volver">
      <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <h1 class="title">Archivos</h1>
    <button class="btn-icon" aria-label="Subir">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </header>

  <div class="toolbar">
    <div class="search" role="search">
      <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="search" placeholder="Buscar archivos..." aria-label="Buscar">
    </div>
  </div>

  <main class="list" role="main" aria-label="Lista de archivos">
    <article class="file-row selected" tabindex="0" onclick="this.classList.toggle('selected')">
      <span class="check" aria-hidden="true"></span>
      <span class="thumb"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>
      <div class="info">
        <div class="name">D37-mcp-graphiti.md</div>
        <div class="meta"><span class="tag">#decisión</span><span>4.2 KB</span><span>hace 2d</span></div>
      </div>
      <div class="act">
        <button class="act-btn" aria-label="Descargar"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
      </div>
    </article>
    <article class="file-row" tabindex="0" onclick="this.classList.toggle('selected')">
      <span class="check" aria-hidden="true"></span>
      <span class="thumb"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>
      <div class="info">
        <div class="name">D36-canvas-bases.md</div>
        <div class="meta"><span class="tag">#decisión</span><span>3.8 KB</span><span>hace 2d</span></div>
      </div>
      <div class="act">
        <button class="act-btn" aria-label="Descargar"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
      </div>
    </article>
    <article class="file-row" tabindex="0" onclick="this.classList.toggle('selected')">
      <span class="check" aria-hidden="true"></span>
      <span class="thumb"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>
      <div class="info">
        <div class="name">PROMPT_DSL_DAG_SHERIFF_V8.md</div>
        <div class="meta"><span class="tag">#pipeline</span><span>5.9 KB</span><span>hace 1h</span></div>
      </div>
      <div class="act">
        <button class="act-btn" aria-label="Descargar"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
      </div>
    </article>
    <article class="file-row" tabindex="0" onclick="this.classList.toggle('selected')">
      <span class="check" aria-hidden="true"></span>
      <span class="thumb"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>
      <div class="info">
        <div class="name">INVESTIGACION_29_PASADAS.md</div>
        <div class="meta"><span class="tag">#research</span><span>20.5 KB</span><span>hace 8h</span></div>
      </div>
      <div class="act">
        <button class="act-btn" aria-label="Descargar"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
      </div>
    </article>
  </main>

  <footer class="footer" role="contentinfo">
    <div class="f-count"><strong>1</strong> seleccionado de 4</div>
    <button class="f-btn" aria-label="Routing" onclick="window.osquestador.routing(['D37'], 'investigador')">
      <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Routing
    </button>
    <button class="f-btn" aria-label="Descargar">
      <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Descargar
    </button>
  </footer>
</div>
<script>
window.osquestador = { routing: function(ids, agent) { console.log('[routing]', ids, agent); return Promise.resolve({routed: ids.length, agent: agent}); } };
</script>
</body>
</html>
