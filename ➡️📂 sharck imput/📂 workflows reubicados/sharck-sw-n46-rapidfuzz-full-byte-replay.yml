name: sharck-sw-n46-rapidfuzz-full-byte-replay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sharck-sw-n46-rapidfuzz-full-byte-replay.yml'
      - '➡️📂 sharck imput/📂 Craxy wall bitácora stated JSON/swarm-claims/CLAIM-SW-N46.json'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_REPO: https://github.com/rapidfuzz/RapidFuzz.git
      SOURCE_COMMIT: db6e504539a9c895180b266a06b36a32cb6029ee
      EXPECTED_TREE: 80b6ab641d0000bd5e6ed1706f6a8ba2c9478e0c
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - name: Full pinned tracked-tree replay plus negative controls
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sw-n46-source /tmp/sw-n46-candidate /tmp/sw-n46-output
          mkdir -p /tmp/sw-n46-source /tmp/sw-n46-candidate /tmp/sw-n46-output
          git -C /tmp/sw-n46-source init -q
          git -C /tmp/sw-n46-source remote add origin "$SOURCE_REPO"
          git -C /tmp/sw-n46-source -c protocol.version=2 fetch --no-tags --depth=1 origin "$SOURCE_COMMIT"
          test "$(git -C /tmp/sw-n46-source rev-parse FETCH_HEAD)" = "$SOURCE_COMMIT"
          test "$(git -C /tmp/sw-n46-source rev-parse FETCH_HEAD^{tree})" = "$EXPECTED_TREE"
          python3 <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          SRC=pathlib.Path('/tmp/sw-n46-source'); CAND=pathlib.Path('/tmp/sw-n46-candidate'); OUT=pathlib.Path('/tmp/sw-n46-output')
          COMMIT=os.environ['SOURCE_COMMIT']; TREE=os.environ['EXPECTED_TREE']

          def git(cwd,*args,input_bytes=None):
              p=subprocess.run(['git','-C',str(cwd),*args],input=input_bytes,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              if p.returncode: raise RuntimeError(f"git {' '.join(args)} rc={p.returncode}: {p.stderr.decode('utf-8','replace')}")
              return p.stdout
          def h(b): return hashlib.sha256(b).hexdigest()
          def pt(b): return b.decode('utf-8','surrogateescape')

          actual_tree=git(SRC,'rev-parse','FETCH_HEAD^{tree}').decode().strip()
          if actual_tree!=TREE: raise RuntimeError(f'tree mismatch {actual_tree} != {TREE}')
          source={}
          for rec in git(SRC,'ls-tree','-rz','-r','FETCH_HEAD').split(b'\0'):
              if not rec: continue
              meta,pb=rec.split(b'\t',1); mb,tb,ob=meta.split(b' ',2)
              mode,typ,oid,path=mb.decode(),tb.decode(),ob.decode(),pt(pb)
              if mode in ('100644','100755','120000'): ident=h(git(SRC,'cat-file','blob',oid))
              elif mode=='160000': ident=oid
              else: raise RuntimeError(f'unsupported source mode {mode} at {path}')
              source[path]={'path':path,'mode':mode,'type':typ,'oid':oid,'identity':ident}

          attrs=git(SRC,'cat-file','blob',source['.gitattributes']['oid']).decode('utf-8','replace')
          active=[x for x in attrs.splitlines() if x.strip() and not x.lstrip().startswith('#')]
          if any('filter=lfs' in x.replace(' ','') for x in active): raise RuntimeError('LFS attribute detected')

          gitlinks={'extern/rapidfuzz-cpp':'82662f3623b3ca3645e543f677fc32fb8bd1fb95','extern/taskflow':'130f7952469c01eef8d7b635710bf9a8043f3172'}
          executables={'tools/backtrace','tools/generate_cython.sh','tools/generate_python.py','tools/seg_wrapper.sh'}
          roots={'.gitignore','.gitattributes','.gitmodules'}
          special=[]
          for p in roots:
              if p not in source: special.append(f'missing root {p}')
          for p,oid in gitlinks.items():
              e=source.get(p)
              if not e or e['mode']!='160000' or e['oid']!=oid: special.append(f'gitlink mismatch {p}')
          for p in executables:
              e=source.get(p)
              if not e or e['mode']!='100755': special.append(f'executable mismatch {p}')

          git(CAND,'init','-q'); git(CAND,'config','core.symlinks','true')
          for path,e in sorted(source.items()):
              t=CAND/path; t.parent.mkdir(parents=True,exist_ok=True); mode=e['mode']; oid=e['oid']
              if mode in ('100644','100755'):
                  b=git(SRC,'cat-file','blob',oid); t.write_bytes(b); os.chmod(t,0o755 if mode=='100755' else 0o644)
                  coid=git(CAND,'hash-object','-w','--stdin',input_bytes=b).decode().strip()
                  if coid!=oid: raise RuntimeError(f'blob OID mismatch {path}')
                  git(CAND,'update-index','--add','--cacheinfo',f'{mode},{coid},{path}')
              elif mode=='120000':
                  b=git(SRC,'cat-file','blob',oid); os.symlink(b.decode('utf-8','surrogateescape'),t)
                  coid=git(CAND,'hash-object','-w','--stdin',input_bytes=b).decode().strip()
                  if coid!=oid: raise RuntimeError(f'symlink OID mismatch {path}')
                  git(CAND,'update-index','--add','--cacheinfo',f'120000,{coid},{path}')
              elif mode=='160000': git(CAND,'update-index','--add','--cacheinfo',f'160000,{oid},{path}')

          def readcand():
              out={}
              for rec in git(CAND,'ls-files','--stage','-z').split(b'\0'):
                  if not rec: continue
                  meta,pb=rec.split(b'\t',1); mb,ob,sb=meta.split(b' ',2); mode,oid,stage,path=mb.decode(),ob.decode(),sb.decode(),pt(pb)
                  if stage!='0': raise RuntimeError(f'nonzero stage {path}')
                  t=CAND/path
                  if mode in ('100644','100755'):
                      data=t.read_bytes(); ident=h(data)
                      if mode=='100755' and not os.access(t,os.X_OK): raise RuntimeError(f'exec lost {path}')
                      if mode=='100644' and os.access(t,os.X_OK): raise RuntimeError(f'unexpected exec {path}')
                  elif mode=='120000':
                      if not t.is_symlink(): raise RuntimeError(f'symlink lost {path}')
                      ident=h(os.readlink(t).encode('utf-8','surrogateescape'))
                  elif mode=='160000': ident=oid
                  else: raise RuntimeError(f'unsupported candidate mode {mode} at {path}')
                  out[path]={'path':path,'mode':mode,'oid':oid,'identity':ident}
              return out

          def compare(c):
              sp,cp=set(source),set(c)
              return {'missing':sorted(sp-cp),'extra':sorted(cp-sp),'changed':sorted(p for p in sp&cp if source[p]['identity']!=c[p]['identity'] or source[p]['oid']!=c[p]['oid']),'mode_mismatch':sorted(p for p in sp&cp if source[p]['mode']!=c[p]['mode'])}

          candidate=readcand(); parity=compare(candidate)
          positive_ok=(len(source)==len(candidate) and not special and not any(parity.values()))
          if not positive_ok: raise RuntimeError(f'positive replay failed {parity} special={special}')
          negatives=[]

          git(CAND,'update-index','--force-remove','.gitignore')
          nc1=compare(readcand()); ok1='.gitignore' in nc1['missing']; negatives.append({'id':'NC1_MISSING','pass':ok1,'observed':nc1})
          e=source['.gitignore']; git(CAND,'update-index','--add','--cacheinfo',f"{e['mode']},{e['oid']},.gitignore")

          p='tools/backtrace'; e=source[p]; os.chmod(CAND/p,0o644); git(CAND,'update-index','--cacheinfo',f"100644,{e['oid']},{p}")
          nc2=compare(readcand()); ok2=p in nc2['mode_mismatch']; negatives.append({'id':'NC2_MODE','pass':ok2,'observed':nc2})
          os.chmod(CAND/p,0o755); git(CAND,'update-index','--cacheinfo',f"100755,{e['oid']},{p}")

          gp='extern/taskflow'; ge=source[gp]; alternate_gitlink=gitlinks['extern/rapidfuzz-cpp']
          git(CAND,'update-index','--cacheinfo',f'160000,{alternate_gitlink},{gp}')
          rogue=CAND/'rogue.extra'; rogue.write_bytes(b'negative-control\n'); roid=git(CAND,'hash-object','-w','--stdin',input_bytes=rogue.read_bytes()).decode().strip()
          git(CAND,'update-index','--add','--cacheinfo',f'100644,{roid},rogue.extra')
          nc3=compare(readcand()); ok3=gp in nc3['changed'] and 'rogue.extra' in nc3['extra']; negatives.append({'id':'NC3_GITLINK_EXTRA','pass':ok3,'observed':nc3})
          git(CAND,'update-index','--cacheinfo',f"160000,{ge['oid']},{gp}"); git(CAND,'update-index','--force-remove','rogue.extra'); rogue.unlink()

          restore=compare(readcand()); restore_ok=not any(restore.values()); negatives_ok=all(x['pass'] for x in negatives)
          result={'schema':'sharck-input.sw-n46-replay-result.v3','source_repo':os.environ['SOURCE_REPO'],'source_commit':COMMIT,'source_tree':actual_tree,'expected_tree':TREE,'source_count':len(source),'candidate_count':len(candidate),**parity,'special_surface_errors':special,'negative_controls':negatives,'negative_controls_pass':negatives_ok,'restore_parity':restore,'restore_pass':restore_ok,'lfs_used':False,'canonical_write':False,'verdict':'PASS' if positive_ok and negatives_ok and restore_ok else 'GAP'}
          OUT.mkdir(parents=True,exist_ok=True)
          (OUT/'source-ledger.json').write_text(json.dumps([source[p] for p in sorted(source)],ensure_ascii=False,indent=2),encoding='utf-8',errors='surrogatepass')
          (OUT/'candidate-ledger.json').write_text(json.dumps([candidate[p] for p in sorted(candidate)],ensure_ascii=False,indent=2),encoding='utf-8',errors='surrogatepass')
          (OUT/'negative-controls.json').write_text(json.dumps(negatives,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'sw-n46-result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          if result['verdict']!='PASS': sys.exit(2)
          PY

      - name: Upload replay evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sw-n46-rapidfuzz-full-byte-replay
          path: /tmp/sw-n46-output
          if-no-files-found: error
          retention-days: 7
