name: Shack Input Gap Recovery — sidecar + canonical motor
run-name: Shack Gap Recovery • ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/shack-input-gap-recovery.yml'
      - '➡️📂 Shack imput/➡️📂 shart imput code Run/acquisition_gap_audit.py'

permissions:
  contents: write

concurrency:
  group: shack-input-gap-recovery
  cancel-in-progress: true

jobs:
  audit-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ENGINE_PATH: ➡️📂motores de descarga extracción copiado movimiento archivos osquestador-auditor/📂Motor descarga de componentes y extracción de zip/hf_download_extract_engine.py
      QUEUE_FILE: ➡️📂 Shack imput/➡️📂 shart imput code Run/queues/07-existing-destination-recovery.json
      STATE_FILE: ➡️📂 Shack imput/📂 Craxy wall bitácora stated JSON/recovery-existing-destination-state.json
      INDEX_PATH: ➡️📂 Shack imput/📂 Craxy wall bitácora stated JSON/RECOVERY-EXISTING-DESTINATION-INDEX.md
      MAX_RETRIES: '3'
      LOOP_SLEEP_SECONDS: '0'
    steps:
      - name: Partial sparse checkout — no LFS
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config core.sparseCheckout true
          git config core.sparseCheckoutCone false
          mkdir -p .git/info
          cat > .git/info/sparse-checkout <<'EOF'
          /.github/workflows/shack-input-gap-recovery.yml
          /➡️📂 Shack imput/➡️📂 shart imput code Run/acquisition_gap_audit.py
          /➡️📂 Shack imput/➡️📂 shart imput code Run/queues/
          /➡️📂 Shack imput/📂 Craxy wall bitácora stated JSON/
          /➡️📂motores de descarga extracción copiado movimiento archivos osquestador-auditor/
          EOF
          AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          git fetch --depth=1 --filter=blob:none origin main
          git checkout -q -B main FETCH_HEAD

      - name: Verify canonical motors unchanged
        shell: bash
        run: |
          set -euo pipefail
          ROOT='➡️📂motores de descarga extracción copiado movimiento archivos osquestador-auditor'
          check_blob(){ test "$(git hash-object "$1")" = "$2" || { echo "MOTOR_CODE_LOCK_GAP $1"; exit 31; }; }
          check_blob "$ROOT/➡️📂 Motor de extracción zip/motor_1_extract_only.py" a52d5dc0e6ff26f75d753b848dcc1a40c5dd4500
          check_blob "$ROOT/📂Motor descarga de componentes y extracción de zip/motor_2_queue_download_extract.py" 84d566e2ee4e98e42eb3a864026d067d48caabd9
          check_blob "$ROOT/📂Motor descarga de componentes y extracción de zip/hf_download_extract_engine.py" 91e6e4486692eab314be5c7130d8310d3c855397
          check_blob "$ROOT/➡️📂motor de copiar archivos/motor_3_copy_batches.py" 3689924361ce4a1a9fde4ae2b6f6009c37a6042d
          check_blob "$ROOT/➡️📂motor de copiar archivos/motor_copy_root_to_repo.py" 8281211da76db3080fe1f1ea38b3eb0c45d655cb
          check_blob "$ROOT/➡️📂motor de moves archivos/motor_4_move_batches.py" 9a21facfe11327cf60a2afca8f415ad52f0ecbe5

      - name: Audit failed existing destinations by Git object identity
        shell: bash
        run: |
          set -euo pipefail
          python3 '➡️📂 Shack imput/➡️📂 shart imput code Run/acquisition_gap_audit.py' | tee gap-audit-summary.json

      - name: Dry-run exact destinations through canonical motor
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(python3 - <<'PY'
          import json
          p='➡️📂 Shack imput/➡️📂 shart imput code Run/queues/07-existing-destination-recovery.json'
          print(len(json.load(open(p)).get('queue', [])))
          PY
          )"
          echo "exact_recovery_queue=$COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo 'NO_EXACT_DESTINATIONS_TO_RECOVER'
            exit 0
          fi
          python3 '➡️📂motores de descarga extracción copiado movimiento archivos osquestador-auditor/📂Motor descarga de componentes y extracción de zip/motor_2_queue_download_extract.py' | tee recovery-motor-output.jsonl

      - name: Persist audit and recovery evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wanted-shark-watchdog'
          git config user.email 'wanted-shark-watchdog@users.noreply.github.com'
          for path in \
            '➡️📂 Shack imput/📂 Craxy wall bitácora stated JSON/ACQUISITION-GAP-AUDIT.json' \
            '➡️📂 Shack imput/➡️📂 shart imput code Run/queues/07-existing-destination-recovery.json' \
            '➡️📂 Shack imput/📂 Craxy wall bitácora stated JSON/recovery-existing-destination-state.json' \
            '➡️📂 Shack imput/📂 Craxy wall bitácora stated JSON/RECOVERY-EXISTING-DESTINATION-INDEX.md'; do
            if [ -e "$path" ]; then git add -- "$path"; fi
          done
          if git diff --cached --quiet; then
            echo 'No recovery evidence changes.'
            exit 0
          fi
          git commit -m 'chore(shack-input): persist acquisition gap recovery evidence'
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep 2
          done
          echo PERSISTENCE_FAILURE
          exit 42
