name: inventory-forensic-v3-osquestador-auditor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inventory-forensic-v3-osquestador-auditor.yml"

permissions:
  contents: read

concurrency:
  group: inventory-forensic-v3-osquestador-auditor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  forensic_inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout main with partial clone
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github

      - name: Build read-only forensic evidence
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          mkdir -p audit-v3
          python3 - <<'PY'
          import json, os, re, subprocess
          from collections import Counter, defaultdict

          repo=os.environ["REPOSITORY"]
          run_id=os.environ["RUN_ID"]
          server=os.environ["SERVER_URL"]

          def cmd(*args, text=False):
              return subprocess.check_output(args, text=text)

          head=cmd("git","rev-parse","HEAD",text=True).strip()
          raw=cmd("git","ls-tree","-r","-l","-z","HEAD")
          files=[]
          for rec in raw.split(b"\x00"):
              if not rec:
                  continue
              meta,path=rec.split(b"\t",1)
              parts=meta.decode().split()
              if len(parts) < 4 or parts[1] != "blob":
                  continue
              size=0 if parts[3]=="-" else int(parts[3])
              files.append({"path":path.decode("utf-8","replace"),"sha":parts[2],"size":size})

          d_raw=cmd("git","ls-tree","-r","-d","-z","HEAD")
          directories=set()
          for rec in d_raw.split(b"\x00"):
              if not rec:
                  continue
              try:
                  directories.add(rec.split(b"\t",1)[1].decode("utf-8","replace"))
              except Exception:
                  pass

          paths={f["path"] for f in files}
          low={p.lower():p for p in paths}
          manifests=[f for f in files if "manifest" in f["path"].lower() and f["path"].lower().endswith((".json",".jsonl"))]

          def show(path):
              return cmd("git","show","HEAD:"+path).decode("utf-8","replace")

          url_keys=["source_url","repo_url","repository_url","url","source","repo","repository"]
          sha_keys=["source_commit","commit_sha","commit","sha","source_sha"]
          name_keys=["canonical_name","component_name","name","slug","id"]
          path_keys=["exact_path","destination","destination_path","target_path","path","output_path"]

          def first(d,keys):
              for k in keys:
                  v=d.get(k)
                  if isinstance(v,str) and v.strip():
                      return v.strip()
              return None

          entries=[]
          errors=[]
          for mf in manifests:
              try:
                  txt=show(mf["path"])
                  objs=[]
                  if mf["path"].lower().endswith(".jsonl"):
                      for n,line in enumerate(txt.splitlines(),1):
                          if not line.strip():
                              continue
                          try:
                              o=json.loads(line)
                              if isinstance(o,dict):
                                  objs.append((n,o))
                          except Exception:
                              errors.append({"path":mf["path"],"line":n,"error":"invalid_jsonl"})
                  else:
                      o=json.loads(txt)
                      if isinstance(o,list):
                          objs=[(i+1,x) for i,x in enumerate(o) if isinstance(x,dict)]
                      elif isinstance(o,dict):
                          arr=o.get("components") or o.get("items") or o.get("downloads")
                          if isinstance(arr,list):
                              objs=[(i+1,x) for i,x in enumerate(arr) if isinstance(x,dict)]
                          else:
                              objs=[(1,o)]
                  for n,d in objs:
                      u=first(d,url_keys); s=first(d,sha_keys); nm=first(d,name_keys); dp=first(d,path_keys)
                      if any([u,s,nm,dp]):
                          entries.append({"manifest_path":mf["path"],"manifest_line":n,
                                          "canonical_name":nm,"source_url":u,"source_commit":s,"declared_path":dp})
              except Exception as e:
                  errors.append({"path":mf["path"],"error":type(e).__name__})

          def norm(u):
              if not u:
                  return None
              x=u.strip().lower()
              if x.endswith(".git"):
                  x=x[:-4]
              return x.rstrip("/")

          zre=re.compile(r"(?i)(\.zip$|\.z\d\d$|\.zip\.\d+$|\.part\d+$)")
          zips=[f for f in files if zre.search(f["path"])]
          groups=defaultdict(list)
          for f in zips:
              b=re.sub(r"(?i)(\.z\d\d$|\.zip\.\d+$|\.part\d+$)","",f["path"])
              if b.lower().endswith(".zip"):
                  b=b[:-4]
              groups[b].append(f)

          components=[]
          for i,e in enumerate(entries,1):
              declared=e.get("declared_path")
              verified=False
              exact=None
              if declared:
                  d=declared.strip().lstrip("./")
                  if d in paths or d in directories:
                      verified=True; exact=d
                  elif d.lower() in low:
                      verified=True; exact=low[d.lower()]
                  elif any(p.startswith(d.rstrip("/")+"/") for p in paths):
                      verified=True; exact=d
              s=e.get("source_commit")
              sha_ok=bool(s and re.fullmatch(r"[0-9a-fA-F]{7,40}",s))
              cid=norm(e.get("source_url")) or ("manifest:"+e["manifest_path"]+":"+str(e["manifest_line"]))
              components.append({
                  "canonical_id":cid,
                  "number":i,
                  "canonical_name":e.get("canonical_name") or cid.rsplit("/",1)[-1],
                  "source_url":e.get("source_url") or "INSUFFICIENT_EVIDENCE",
                  "source_commit":s if sha_ok else "INSUFFICIENT_EVIDENCE",
                  "repository":repo,
                  "branch":"main",
                  "exact_path":exact or declared or "INSUFFICIENT_EVIDENCE",
                  "manifest_path":e["manifest_path"],
                  "workflow_run_url":server+"/"+repo+"/actions/runs/"+run_id,
                  "status":"COMPLETE" if verified and e.get("source_url") and sha_ok else "INSUFFICIENT_EVIDENCE",
                  "evidence":{
                      "tree_verified":True,
                      "manifest_verified":True,
                      "sha_verified":sha_ok,
                      "zip_verified":False,
                      "destination_verified":verified,
                      "workflow_verified":True
                  }
              })

          ids=Counter(c["canonical_id"] for c in components)
          duplicates=[{"canonical_id":k,"count":v} for k,v in ids.items() if v>1]
          out={
              "schema":"YAIWES-INVENTORY-INDEXES-V3",
              "repository":repo,
              "branch":"main",
              "main_commit":head,
              "workflow_run_url":server+"/"+repo+"/actions/runs/"+run_id,
              "tree":{"files":len(files),"directories":len(directories)},
              "manifests":[{"path":x["path"],"size":x["size"],"git_blob_sha":x["sha"]} for x in manifests],
              "manifest_errors":errors,
              "zip_parts":{
                  "file_count":len(zips),
                  "groups":[{"base":k,"parts":len(v),"maximum_part_size":max([int(x["size"]) for x in v] or [0]),
                             "files":[{"path":x["path"],"size":x["size"]} for x in v]}
                            for k,v in sorted(groups.items())]
              },
              "components":components,
              "duplicates":duplicates,
              "counts":{
                  "manifest_entries":len(entries),
                  "components":len(components),
                  "complete":sum(c["status"]=="COMPLETE" for c in components),
                  "insufficient_evidence":sum(c["status"]=="INSUFFICIENT_EVIDENCE" for c in components),
                  "duplicate_ids":len(duplicates)
              }
          }
          with open("audit-v3/inventory-evidence-v3.json","w",encoding="utf-8") as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
          with open("audit-v3/inventory-evidence-v3.md","w",encoding="utf-8") as f:
              f.write("# Auditoría forense V3 — "+repo+"\n\n")
              f.write("- Branch: main\n- Main commit: "+head+"\n")
              f.write("- Run: "+out["workflow_run_url"]+"\n")
              f.write("- Files: "+str(len(files))+"\n- Directories: "+str(len(directories))+"\n")
              f.write("- Manifests: "+str(len(manifests))+"\n- ZIP/parts: "+str(len(zips))+"\n")
              f.write("- Components: "+str(len(components))+"\n")
              f.write("- COMPLETE: "+str(out["counts"]["complete"])+"\n")
              f.write("- INSUFFICIENT_EVIDENCE: "+str(out["counts"]["insufficient_evidence"])+"\n")
              f.write("- Duplicate canonical IDs: "+str(len(duplicates))+"\n\n")
              f.write("## Componentes\n\n")
              for c in components:
                  f.write(str(c["number"])+". "+c["canonical_name"]+" — "+c["status"]+" — "+c["exact_path"]+"\n")
          PY

      - name: Validate evidence
        run: |
          test -s audit-v3/inventory-evidence-v3.json
          test -s audit-v3/inventory-evidence-v3.md
          python3 -m json.tool audit-v3/inventory-evidence-v3.json >/dev/null

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-forensic-v3-osquestador-auditor
          path: audit-v3/
          if-no-files-found: error
          retention-days: 30
