name: inventory-forensic-v3-gap4-crossrepo-tree

on:
  push:
    paths:
      - '.github/workflows/inventory-forensic-v3-gap4-crossrepo-tree.yml'

permissions:
  contents: read

jobs:
  crossrepo-tree-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Scan seven repository trees for four ZIP families
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request

          repos = [
            'maxbry123-commits/agentes',
            'maxbry123-commits/nct-core',
            'maxbry123-commits/router-universal-router-inteligente-',
            'maxbry123-commits/Orquestador-Maxbry-',
            'maxbry123-commits/osquestador-auditor',
            'maxbry123-commits/Agentes-motores-Wordflow-YAIWES',
            'maxbry123-commits/frontend',
          ]
          slugs = ['ladybug', 'kuzu', 'hypermem', 'airflow']
          token = os.environ.get('GH_TOKEN','')
          headers = {'Accept':'application/vnd.github+json','User-Agent':'yaiwes-inventory-v3'}
          if token:
            headers['Authorization'] = f'Bearer {token}'

          def get(url):
            req = urllib.request.Request(url, headers=headers)
            with urllib.request.urlopen(req, timeout=60) as r:
              return json.load(r)

          out = []
          for repo in repos:
            meta = get(f'https://api.github.com/repos/{repo}')
            branch = meta['default_branch']
            ref = get(f'https://api.github.com/repos/{repo}/git/ref/heads/{branch}')
            commit_sha = ref['object']['sha']
            commit = get(f'https://api.github.com/repos/{repo}/git/commits/{commit_sha}')
            tree_sha = commit['tree']['sha']
            tree = get(f'https://api.github.com/repos/{repo}/git/trees/{tree_sha}?recursive=1')
            paths = [x.get('path','') for x in tree.get('tree',[]) if x.get('type')=='blob']
            for slug in slugs:
              hits = [p for p in paths if p.lower().endswith('.zip') and slug in p.lower()]
              out.append({'repository':repo,'branch':branch,'slug':slug,'zip_hits':hits})

          with open('gap4-crossrepo-tree.json','w',encoding='utf-8') as f:
            json.dump(out,f,indent=2,ensure_ascii=False)
          with open('gap4-crossrepo-tree.md','w',encoding='utf-8') as f:
            f.write('# YAIWES INVENTORY V3 — four GAP cross-repo tree evidence\n\n')
            for row in out:
              f.write(f"## {row['repository']} — {row['slug']}\n")
              if row['zip_hits']:
                for p in row['zip_hits']:
                  f.write(f'- `{p}`\n')
              else:
                f.write('- NO_ZIP_HIT\n')
          PY

      - name: Validate evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s gap4-crossrepo-tree.json
          test -s gap4-crossrepo-tree.md

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: inventory-forensic-v3-gap4-crossrepo-tree
          path: |
            gap4-crossrepo-tree.json
            gap4-crossrepo-tree.md
          if-no-files-found: error
