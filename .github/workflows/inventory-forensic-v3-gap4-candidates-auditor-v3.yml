name: inventory-forensic-v3-gap4-candidates-auditor-v3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inventory-forensic-v3-gap4-candidates-auditor-v3.yml"

permissions:
  contents: read

jobs:
  gap4_candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
      - name: Emit candidate ZIP paths for exact four gaps
        run: |
          set -euo pipefail
          mkdir -p audit-gap4
          git ls-tree -r --name-only HEAD > /tmp/paths.txt
          python3 - <<'PY'
          import json,re,os
          targets={
            'ladybug':{'source':'https://github.com/LadybugDB/ladybug.git','sha':'dd9ca6cc70f8e57add26d132cc0d386a87b326c9','parts':2},
            'kuzu':{'source':'https://github.com/kuzudb/kuzu.git','sha':'89f0263cc7a1fd9c396d2c4953747a013556a7f9','parts':12},
            'hypermem':{'source':'https://github.com/EverMind-AI/HyperMem.git','sha':'15c700908f3ec64d6931f253695e42c679a4c958','parts':1},
            'airflow':{'source':'https://github.com/apache/airflow.git','sha':'b0721979b92e4cddc13afe294b5a034ec90d0e49','parts':9},
          }
          paths=[x.rstrip('\n') for x in open('/tmp/paths.txt',encoding='utf-8',errors='replace')]
          zips=[p for p in paths if p.lower().endswith('.zip')]
          def norm(x): return re.sub(r'[^a-z0-9]+','',x.lower())
          out={}
          for key,t in targets.items():
            c=[]
            for p in zips:
              bn=os.path.basename(p)
              stem=re.sub(r'_[0-9]{4}\.zip$','',bn,flags=re.I)
              ns=norm(stem)
              if key in ns or ns in key or (key=='ladybug' and 'ladybugdb' in ns) or (key=='hypermem' and 'evermind' in ns):
                c.append(p)
            out[key]={'target':t,'candidates':c}
          open('audit-gap4/candidates.json','w').write(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: inventory-forensic-v3-gap4-candidates-auditor-v3
          path: audit-gap4/
          if-no-files-found: error
          retention-days: 30
