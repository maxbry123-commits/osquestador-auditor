name: inventory-forensic-v3-recovery-global-zipmap-auditor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inventory-forensic-v3-recovery-global-zipmap-auditor.yml"

permissions:
  contents: read

jobs:
  inventory-forensic-v3-recovery-auditor:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
      - name: Recover scoped manifest against all ZIP destinations
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          mkdir -p audit-v3-recovery
          python3 - <<'PY'
          import json, os, re, subprocess
          from collections import Counter, defaultdict
          repo=os.environ['REPOSITORY']; run_id=os.environ['RUN_ID']; server=os.environ['SERVER_URL']
          manifest='Download code osquestador auditor memoria/RESEARCH_DOWNLOAD_MANIFEST.jsonl'
          def out(*a): return subprocess.check_output(a)
          head=out('git','rev-parse','HEAD').decode().strip()
          raw=out('git','ls-tree','-r','-l','-z','HEAD')
          files=[]
          for rec in raw.split(b'\0'):
              if not rec: continue
              meta,path=rec.split(b'\t',1); p=meta.decode().split()
              if len(p)>=4 and p[1]=='blob': files.append({'path':path.decode('utf-8','replace'),'size':0 if p[3]=='-' else int(p[3])})
          def show(path): return out('git','show','HEAD:'+path).decode('utf-8','replace')
          zip_re=re.compile(r'(?i)^(.*)_([0-9]{4})\.zip$')
          groups=defaultdict(list)
          for f in files:
              bn=os.path.basename(f['path']); m=zip_re.match(bn)
              if m: groups[(os.path.dirname(f['path']),m.group(1))].append({'path':f['path'],'part':int(m.group(2)),'size':f['size']})
          def norm(s): return re.sub(r'[^a-z0-9]+','',str(s).lower())
          def srcname(url):
              if not isinstance(url,str): return ''
              x=url.rstrip('/'); x=x[:-4] if x.lower().endswith('.git') else x
              return x.rsplit('/',1)[-1]
          rows=[]; excluded=[]; errors=[]
          for ln,line in enumerate(show(manifest).splitlines(),1):
              if not line.strip(): continue
              try: d=json.loads(line)
              except Exception: errors.append({'line':ln,'error':'invalid_jsonl'}); continue
              slug=str(d.get('slug') or d.get('name') or '').strip(); source=d.get('source') or d.get('source_url'); sha=d.get('source_commit') or d.get('commit') or d.get('sha'); st=str(d.get('status') or '').upper()
              try: expected=int(d.get('parts'))
              except Exception: expected=None
              if st=='SKIPPED' and not sha and expected is None:
                  excluded.append({'line':ln,'slug':slug,'source':source,'reason':d.get('reason'),'classification':'EXCLUDED_NON_DOWNLOADED'}); continue
              wanted={norm(slug),norm(srcname(source))}; wanted.discard('')
              exact=[]
              for (directory,stem),parts in groups.items():
                  if norm(stem) not in wanted: continue
                  ordered=sorted(parts,key=lambda x:x['part']); seq=[x['part'] for x in ordered]
                  if expected is not None and len(ordered)==expected and seq==list(range(1,expected+1)):
                      exact.append({'directory':directory,'stem':stem,'files':[x['path'] for x in ordered],'maximum_part_size':max(x['size'] for x in ordered)})
              sha_ok=isinstance(sha,str) and re.fullmatch(r'[0-9a-fA-F]{40}',sha) is not None
              source_ok=isinstance(source,str) and source.startswith(('https://github.com/','http://github.com/','https://huggingface.co/'))
              if not source_ok or not sha_ok: status='INSUFFICIENT_EVIDENCE'
              elif not exact: status='GAP'
              elif len(exact)>1: status='DUPLICATE_RELOCATED'
              else: status='COMPLETE'
              canonical=(source[:-4] if isinstance(source,str) and source.lower().endswith('.git') else source)
              canonical=canonical.lower().rstrip('/') if isinstance(canonical,str) else f'manifest:{ln}'
              rows.append({'canonical_id':canonical,'canonical_name':slug or srcname(source),'source_url':source,'source_commit':sha if sha_ok else 'INSUFFICIENT_EVIDENCE','repository':repo,'branch':'main','manifest_path':manifest,'manifest_line':ln,'expected_parts':expected,'status':status,'locations':exact,'evidence':{'tree_verified':True,'manifest_verified':True,'sha_verified':sha_ok,'zip_verified':bool(exact),'destination_verified':bool(exact),'workflow_verified':True}})
          counts=Counter(r['status'] for r in rows)
          result={'schema':'YAIWES-INVENTORY-INDEXES-V3-AUDITOR-GLOBAL-ZIPMAP','repository':repo,'branch':'main','main_commit':head,'workflow_run_url':f'{server}/{repo}/actions/runs/{run_id}','manifest':manifest,'components':rows,'excluded_non_downloaded':excluded,'errors':errors,'counts':{'manifest_rows':len(rows)+len(excluded),'downloaded_universe':len(rows),'unique_versions':len(set((r['canonical_id'],r['source_commit']) for r in rows)),'unique_canonical':len(set(r['canonical_id'] for r in rows)),'complete':counts['COMPLETE'],'duplicate_relocated':counts['DUPLICATE_RELOCATED'],'gaps':counts['GAP'],'insufficient_evidence':counts['INSUFFICIENT_EVIDENCE'],'excluded_non_downloaded':len(excluded)}}
          json.dump(result,open('audit-v3-recovery/inventory-recovery-auditor-v3.json','w'),ensure_ascii=False,indent=2)
          with open('audit-v3-recovery/inventory-recovery-auditor-v3.md','w') as f:
              f.write('# Auditor recovery global ZIP map V3\n\n')
              for k,v in result['counts'].items(): f.write(f'- {k}: {v}\n')
          PY
      - name: Validate evidence
        run: |
          test -s audit-v3-recovery/inventory-recovery-auditor-v3.json
          python3 -m json.tool audit-v3-recovery/inventory-recovery-auditor-v3.json >/dev/null
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: inventory-forensic-v3-recovery-global-zipmap-auditor
          path: audit-v3-recovery/
          if-no-files-found: error
          retention-days: 30
