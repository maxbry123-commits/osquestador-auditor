name: Sharck Input — staging StrategyDelta sandbox simulation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sharck-input-staging-strategydelta-sim.yml'

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout canonical Motor 3 only — NO LFS
        shell: bash
        run: |
          set -euo pipefail
          git init -q project-src
          cd project-src
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config core.sparseCheckout true
          git config core.sparseCheckoutCone false
          mkdir -p .git/info
          cat > .git/info/sparse-checkout <<'EOF'
          /➡️📂motores de descarga extracción copiado movimiento archivos osquestador-auditor/➡️📂motor de copiar archivos/motor_3_copy_batches.py
          /.gitignore
          EOF
          git config filter.lfs.smudge cat
          git config filter.lfs.clean cat
          git config filter.lfs.required false
          git fetch --depth=1 --filter=blob:none origin main
          git checkout -q -B main FETCH_HEAD
          MOTOR='➡️📂motores de descarga extracción copiado movimiento archivos osquestador-auditor/➡️📂motor de copiar archivos/motor_3_copy_batches.py'
          test "$(git hash-object "$MOTOR")" = '3689924361ce4a1a9fde4ae2b6f6009c37a6042d'

      - name: Prepare exact upstream snapshots in sandbox
        shell: bash
        run: |
          set -euo pipefail
          fetch_snapshot() {
            repo="$1"; commit="$2"; out="$3"
            git init -q "$out-git"
            git -C "$out-git" remote add origin "$repo"
            git -C "$out-git" config filter.lfs.smudge cat
            git -C "$out-git" config filter.lfs.clean cat
            git -C "$out-git" config filter.lfs.required false
            git -C "$out-git" fetch --depth=1 --filter=blob:none origin "$commit"
            git -C "$out-git" checkout -q --detach FETCH_HEAD
            mkdir -p "$out"
            git -C "$out-git" archive HEAD | tar -x -C "$out"
          }
          fetch_snapshot https://github.com/explosion/spaCy.git 26b4d1dc04a812f426e4bef3e8a1b6f159d6f048 /tmp/source-spacy
          fetch_snapshot https://github.com/opensearch-project/OpenSearch.git 0249cde03ef66b56ac61e8929c3ba7e10b062523 /tmp/source-opensearch

      - name: Motor 3 copy exact snapshots into candidate sandbox repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/candidate
          cp project-src/.gitignore /tmp/candidate/.gitignore
          git init -q /tmp/candidate
          git -C /tmp/candidate config user.name sharck-sandbox
          git -C /tmp/candidate config user.email sandbox@example.invalid
          git -C /tmp/candidate add .gitignore
          git -C /tmp/candidate commit -q -m base
          MOTOR="$PWD/project-src/➡️📂motores de descarga extracción copiado movimiento archivos osquestador-auditor/➡️📂motor de copiar archivos/motor_3_copy_batches.py"
          SOURCE_DIR=/tmp/source-spacy DEST_DIR=/tmp/candidate/vendor/spaCy STATE_FILE=/tmp/motor3-spacy.json BATCH_SIZE=100 COLLISION_POLICY=fail python3 "$MOTOR"
          SOURCE_DIR=/tmp/source-opensearch DEST_DIR=/tmp/candidate/vendor/OpenSearch STATE_FILE=/tmp/motor3-opensearch.json BATCH_SIZE=100 COLLISION_POLICY=fail python3 "$MOTOR"

      - name: Demonstrate current staging failure
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/candidate /tmp/current
          git -C /tmp/current add -- vendor/spaCy vendor/OpenSearch || true
          python3 - <<'PY'
          import hashlib, pathlib, subprocess
          repo='/tmp/current'
          checks=[
            ('spaCy C','vendor/spaCy/spacy/matcher/polyleven.c'),
            ('spaCy VSCode','vendor/spaCy/website/.vscode/extensions.json'),
            ('OpenSearch license','vendor/OpenSearch/plugins/ingest-attachment/licenses/commons-collections4-LICENSE.txt'),
          ]
          for name,p in checks:
              q=subprocess.run(['git','-C',repo,'ls-files','--error-unmatch',p],stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              print(f'CURRENT_INDEX {name} tracked={q.returncode==0}')
          p='vendor/OpenSearch/plugins/ingest-attachment/licenses/commons-collections4-LICENSE.txt'
          q=subprocess.run(['git','-C',repo,'show',':'+p],stdout=subprocess.PIPE,stderr=subprocess.PIPE)
          if q.returncode==0:
              src=pathlib.Path('/tmp/source-opensearch/plugins/ingest-attachment/licenses/commons-collections4-LICENSE.txt').read_bytes()
              print('CURRENT_OPENSEARCH_BYTE_EQUAL='+str(q.stdout==src))
          PY

      - name: Candidate staging — force tracked snapshot and neutralize attributes only during indexing
        shell: bash
        run: |
          set -euo pipefail
          ATTR=/tmp/candidate/vendor/OpenSearch/.gitattributes
          cp "$ATTR" /tmp/OpenSearch.gitattributes.saved
          rm "$ATTR"
          git -C /tmp/candidate add -f -- vendor/spaCy vendor/OpenSearch
          cp /tmp/OpenSearch.gitattributes.saved "$ATTR"
          git -C /tmp/candidate add -f -- vendor/OpenSearch/.gitattributes

      - name: Verify candidate index byte-for-byte before any commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, subprocess, sys
          repo='/tmp/candidate'
          pairs=[
            ('/tmp/source-spacy/spacy/matcher/polyleven.c','vendor/spaCy/spacy/matcher/polyleven.c'),
            ('/tmp/source-spacy/website/.vscode/extensions.json','vendor/spaCy/website/.vscode/extensions.json'),
            ('/tmp/source-opensearch/plugins/ingest-attachment/licenses/commons-collections4-LICENSE.txt','vendor/OpenSearch/plugins/ingest-attachment/licenses/commons-collections4-LICENSE.txt'),
            ('/tmp/source-opensearch/plugins/ingest-attachment/licenses/commons-collections4-NOTICE.txt','vendor/OpenSearch/plugins/ingest-attachment/licenses/commons-collections4-NOTICE.txt'),
            ('/tmp/source-opensearch/plugins/ingest-attachment/licenses/xz-LICENSE.txt','vendor/OpenSearch/plugins/ingest-attachment/licenses/xz-LICENSE.txt'),
          ]
          ok=True
          for srcp,idxp in pairs:
              src=pathlib.Path(srcp).read_bytes()
              q=subprocess.run(['git','-C',repo,'show',':'+idxp],stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              same=(q.returncode==0 and q.stdout==src)
              print(f'CANDIDATE_BYTE_EQUAL path={idxp} value={same} source_sha={hashlib.sha256(src).hexdigest()} index_sha={hashlib.sha256(q.stdout).hexdigest() if q.returncode==0 else "MISSING"}')
              ok &= same
          print('CANDIDATE_VERDICT=' + ('SANDBOX_PASS' if ok else 'SANDBOX_FAIL'))
          sys.exit(0 if ok else 41)
          PY
