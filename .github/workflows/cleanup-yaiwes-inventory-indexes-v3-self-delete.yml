name: cleanup-yaiwes-inventory-indexes-v3-self-delete

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-yaiwes-inventory-indexes-v3-self-delete.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Delete exact allowlist only
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            ".github/workflows/inventory-forensic-v3-osquestador-auditor.yml"
            ".github/workflows/inventory-forensic-v3-recovery-fast-osquestador-auditor.yml"
            ".github/scripts/inventory_forensic_v3_auditor_scoped.py"
            ".github/workflows/inventory-forensic-v3-recovery-auditor-scoped-v2.yml"
            ".github/workflows/inventory-forensic-v3-recovery-global-zipmap-auditor.yml"
            ".github/workflows/inventory-forensic-v3-recovery-fastpath-auditor-v2.yml"
            ".github/workflows/inventory-forensic-v3-gap4-candidates-auditor-v3.yml"
            ".github/workflows/inventory-forensic-v3-gap4-crossrepo-tree.yml"
            ".github/workflows/inventory-forensic-v3-gap4-provenance-v2.yml"
          )
          for p in "${targets[@]}"; do
            if git ls-files --error-unmatch -- "$p" >/dev/null 2>&1; then
              git rm -f -- "$p"
              echo "REMOVED $p"
            else
              echo "ABSENT  $p"
            fi
          done

      - name: Self delete cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -f -- ".github/workflows/cleanup-yaiwes-inventory-indexes-v3-self-delete.yml"

      - name: Commit surgical cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "yaiwes-v3-cleanup"
          git config user.email "yaiwes-v3-cleanup@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "cleanup(YAIWES-INVENTORY-INDEXES-V3): remove exact audit artifacts and self-delete"
          git push origin HEAD:main

      - name: Guard against collateral deletion
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD^ HEAD || true)"
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            case "$p" in
              ".github/workflows/cleanup-yaiwes-inventory-indexes-v3-self-delete.yml") ;;
              ".github/workflows/inventory-forensic-v3-osquestador-auditor.yml") ;;
              ".github/workflows/inventory-forensic-v3-recovery-fast-osquestador-auditor.yml") ;;
              ".github/scripts/inventory_forensic_v3_auditor_scoped.py") ;;
              ".github/workflows/inventory-forensic-v3-recovery-auditor-scoped-v2.yml") ;;
              ".github/workflows/inventory-forensic-v3-recovery-global-zipmap-auditor.yml") ;;
              ".github/workflows/inventory-forensic-v3-recovery-fastpath-auditor-v2.yml") ;;
              ".github/workflows/inventory-forensic-v3-gap4-candidates-auditor-v3.yml") ;;
              ".github/workflows/inventory-forensic-v3-gap4-crossrepo-tree.yml") ;;
              ".github/workflows/inventory-forensic-v3-gap4-provenance-v2.yml") ;;
              *) echo "UNAUTHORIZED_CHANGE $p"; exit 1 ;;
            esac
          done <<< "$changed"

# trigger final surgical cleanup

