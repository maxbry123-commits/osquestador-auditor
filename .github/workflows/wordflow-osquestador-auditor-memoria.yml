name: Wordflow osquestador auditor memoria
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: osq-main-oss
  cancel-in-progress: false
jobs:
  descarga-extraccion:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false
      - name: Preparar tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y zip unzip
      - name: ZIP + EXTRACT 96 skip-fail
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/research_download_osq.py
