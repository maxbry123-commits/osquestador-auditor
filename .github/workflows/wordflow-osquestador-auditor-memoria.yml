name: Wordflow osquestador auditor memoria
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wordflow-osquestador-auditor-memoria.yml'
      - 'scripts/research_download_osq.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: osq-main-oss
  cancel-in-progress: false
jobs:
  descarga-extraccion:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false
      - name: Eliminar capacidad LFS del runner
        shell: bash
        run: |
          set -euo pipefail
          if dpkg-query -W -f='${Status}' git-lfs 2>/dev/null | grep -q 'install ok installed'; then
            sudo apt-get purge -y git-lfs
          fi
          ! command -v git-lfs
      - name: Preparar tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y zip unzip
      - name: Limpiar descarga anterior
        shell: bash
        run: |
          set -euo pipefail
          rm -rf 'Download code osquestador auditor memoria'
          mkdir -p 'Download code osquestador auditor memoria'
      - name: ZIP + EXTRACT 96 desde cero
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/research_download_osq.py
