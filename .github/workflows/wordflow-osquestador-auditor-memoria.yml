name: Wordflow osquestador auditor memoria
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wordflow-osquestador-auditor-memoria.yml'
      - 'scripts/research_download_osq.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: osq-main-oss
  cancel-in-progress: false
jobs:
  descarga-extraccion:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false
      - name: Preparar tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y zip unzip
      - name: Limpiar descargas generadas sin borrar REPOS.json
        shell: bash
        run: |
          set -euo pipefail
          find 'Download code osquestador auditor memoria' -maxdepth 1 -type f -name '*.zip' -delete
          rm -f 'Download code osquestador auditor memoria/RESEARCH_DOWNLOAD_MANIFEST.jsonl'
          test -f 'Download code osquestador auditor memoria/REPOS.json'
      - name: ZIP + EXTRACT 96 desde cero
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/research_download_osq.py
