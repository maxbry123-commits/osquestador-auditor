name: Wordflow osquestador auditor memoria
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: osq-main-oss
  cancel-in-progress: false
env:
  GIT_LFS_SKIP_SMUDGE: '1'
jobs:
  descarga-extraccion:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: ZIP + EXTRACT 96
        run: |
          set -euo pipefail
          git lfs uninstall --local || true
          sudo apt-get update -y && sudo apt-get install -y zip unzip
          python3 scripts/research_download_osq.py
