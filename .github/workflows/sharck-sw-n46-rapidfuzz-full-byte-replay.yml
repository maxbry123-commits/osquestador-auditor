name: sharck-sw-n46-rapidfuzz-full-byte-replay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sharck-sw-n46-rapidfuzz-full-byte-replay.yml'
      - '➡️📂 sharck imput/📂 Craxy wall bitácora stated JSON/swarm-claims/CLAIM-SW-N46.json'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_REPO: https://github.com/rapidfuzz/RapidFuzz.git
      SOURCE_COMMIT: db6e504539a9c895180b266a06b36a32cb6029ee
      EXPECTED_TREE: 80b6ab641d0000bd5e6ed1706f6a8ba2c9478e0c
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - name: Full pinned tracked-tree replay plus negative controls
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sw-n46-source /tmp/sw-n46-candidate /tmp/sw-n46-output
          mkdir -p /tmp/sw-n46-source /tmp/sw-n46-candidate /tmp/sw-n46-output
          git -C /tmp/sw-n46-source init -q
          git -C /tmp/sw-n46-source remote add origin "$SOURCE_REPO"
          git -C /tmp/sw-n46-source -c protocol.version=2 fetch --no-tags --depth=1 origin "$SOURCE_COMMIT"
          test "$(git -C /tmp/sw-n46-source rev-parse FETCH_HEAD)" = "$SOURCE_COMMIT"
          test "$(git -C /tmp/sw-n46-source rev-parse FETCH_HEAD^{tree})" = "$EXPECTED_TREE"
          python3 <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys

          SRC = pathlib.Path('/tmp/sw-n46-source')
          CAND = pathlib.Path('/tmp/sw-n46-candidate')
          OUT = pathlib.Path('/tmp/sw-n46-output')
          COMMIT = os.environ['SOURCE_COMMIT']
          EXPECTED_TREE = os.environ['EXPECTED_TREE']

          def git(cwd, *args, input_bytes=None):
              p = subprocess.run(['git', '-C', str(cwd), *args], input=input_bytes,
                                 stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False)
              if p.returncode != 0:
                  raise RuntimeError(f"git {' '.join(args)} rc={p.returncode}: {p.stderr.decode('utf-8','replace')}")
              return p.stdout

          def sha256(data):
              return hashlib.sha256(data).hexdigest()

          def path_text(raw):
              return raw.decode('utf-8', 'surrogateescape')

          tree = git(SRC, 'rev-parse', 'FETCH_HEAD^{tree}').decode().strip()
          if tree != EXPECTED_TREE:
              raise RuntimeError(f'tree mismatch {tree} != {EXPECTED_TREE}')

          source = {}
          for rec in git(SRC, 'ls-tree', '-rz', '-r', 'FETCH_HEAD').split(b'\0'):
              if not rec:
                  continue
              meta, path_b = rec.split(b'\t', 1)
              mode_b, typ_b, oid_b = meta.split(b' ', 2)
              mode, typ, oid, path = mode_b.decode(), typ_b.decode(), oid_b.decode(), path_text(path_b)
              if mode in ('100644','100755','120000'):
                  identity = sha256(git(SRC, 'cat-file', 'blob', oid))
              elif mode == '160000':
                  identity = oid
              else:
                  raise RuntimeError(f'unsupported source mode {mode} at {path}')
              source[path] = {'path':path,'mode':mode,'type':typ,'oid':oid,'identity':identity}

          if '.gitattributes' in source:
              attrs = git(SRC, 'cat-file', 'blob', source['.gitattributes']['oid']).decode('utf-8','replace')
              active = [x for x in attrs.splitlines() if x.strip() and not x.lstrip().startswith('#')]
              if any('filter=lfs' in x.replace(' ','') for x in active):
                  raise RuntimeError('LFS attribute detected; fail closed')

          expected_gitlinks = {
              'extern/rapidfuzz-cpp':'82662f3623b3ca3645e543f677fc32fb8bd1fb95',
              'extern/taskflow':'130f7952469c01eef8d7b635710bf9a8043f3172',
          }
          expected_exec = {'tools/backtrace','tools/generate_cython.sh','tools/generate_python.py','tools/seg_wrapper.sh'}
          expected_root = {'.gitignore','.gitattributes','.gitmodules'}
          special_errors = []
          for p in expected_root:
              if p not in source: special_errors.append(f'missing special root {p}')
          for p, oid in expected_gitlinks.items():
              e = source.get(p)
              if not e or e['mode'] != '160000' or e['oid'] != oid: special_errors.append(f'gitlink mismatch {p}')
          for p in expected_exec:
              e = source.get(p)
              if not e or e['mode'] != '100755': special_errors.append(f'executable mismatch {p}')

          git(CAND, 'init', '-q')
          git(CAND, 'config', 'core.symlinks', 'true')
          for path, e in sorted(source.items()):
              target = CAND / path
              target.parent.mkdir(parents=True, exist_ok=True)
              mode, oid = e['mode'], e['oid']
              if mode in ('100644','100755'):
                  blob = git(SRC, 'cat-file', 'blob', oid)
                  target.write_bytes(blob)
                  os.chmod(target, 0o755 if mode == '100755' else 0o644)
                  cand_oid = git(CAND, 'hash-object', '-w', '--stdin', input_bytes=blob).decode().strip()
                  if cand_oid != oid: raise RuntimeError(f'blob OID mismatch {path}')
                  git(CAND, 'update-index', '--add', '--cacheinfo', f'{mode},{cand_oid},{path}')
              elif mode == '120000':
                  blob = git(SRC, 'cat-file', 'blob', oid)
                  os.symlink(blob.decode('utf-8','surrogateescape'), target)
                  cand_oid = git(CAND, 'hash-object', '-w', '--stdin', input_bytes=blob).decode().strip()
                  if cand_oid != oid: raise RuntimeError(f'symlink OID mismatch {path}')
                  git(CAND, 'update-index', '--add', '--cacheinfo', f'120000,{cand_oid},{path}')
              elif mode == '160000':
                  git(CAND, 'update-index', '--add', '--cacheinfo', f'160000,{oid},{path}')

          def read_candidate():
              out = {}
              for rec in git(CAND, 'ls-files', '--stage', '-z').split(b'\0'):
                  if not rec: continue
                  meta, path_b = rec.split(b'\t', 1)
                  mode_b, oid_b, stage_b = meta.split(b' ', 2)
                  mode, oid, stage, path = mode_b.decode(), oid_b.decode(), stage_b.decode(), path_text(path_b)
                  if stage != '0': raise RuntimeError(f'non-zero stage {path}')
                  target = CAND / path
                  if mode in ('100644','100755'):
                      data = target.read_bytes()
                      identity = sha256(data)
                      if mode == '100755' and not os.access(target, os.X_OK): raise RuntimeError(f'exec bit lost {path}')
                      if mode == '100644' and os.access(target, os.X_OK): raise RuntimeError(f'unexpected exec bit {path}')
                  elif mode == '120000':
                      if not target.is_symlink(): raise RuntimeError(f'symlink lost {path}')
                      identity = sha256(os.readlink(target).encode('utf-8','surrogateescape'))
                  elif mode == '160000':
                      identity = oid
                  else: raise RuntimeError(f'unsupported candidate mode {mode} at {path}')
                  out[path] = {'path':path,'mode':mode,'oid':oid,'identity':identity}
              return out

          def compare(candidate):
              sp, cp = set(source), set(candidate)
              return {
                  'missing': sorted(sp-cp),
                  'extra': sorted(cp-sp),
                  'changed': sorted(p for p in sp&cp if source[p]['identity'] != candidate[p]['identity'] or source[p]['oid'] != candidate[p]['oid']),
                  'mode_mismatch': sorted(p for p in sp&cp if source[p]['mode'] != candidate[p]['mode']),
              }

          candidate = read_candidate()
          parity = compare(candidate)
          positive_ok = not any(parity.values()) and not special_errors and len(source) == len(candidate)
          if not positive_ok:
              raise RuntimeError(f'positive replay failed: {parity}, special={special_errors}')

          negatives = []

          # NC1: remove one tracked entry from candidate index; must detect missing.
          git(CAND, 'update-index', '--force-remove', '.gitignore')
          nc1 = compare(read_candidate())
          nc1_ok = '.gitignore' in nc1['missing']
          negatives.append({'id':'NC1_MISSING','expected':'.gitignore in missing','observed':nc1,'pass':nc1_ok})
          e = source['.gitignore']
          git(CAND, 'update-index', '--add', '--cacheinfo', f"{e['mode']},{e['oid']},.gitignore")

          # NC2: flip a real executable mode in both index and filesystem; must detect mode mismatch.
          p = 'tools/backtrace'; e = source[p]
          os.chmod(CAND/p, 0o644)
          git(CAND, 'update-index', '--cacheinfo', f"100644,{e['oid']},{p}")
          nc2 = compare(read_candidate())
          nc2_ok = p in nc2['mode_mismatch']
          negatives.append({'id':'NC2_MODE','expected':f'{p} in mode_mismatch','observed':nc2,'pass':nc2_ok})
          os.chmod(CAND/p, 0o755)
          git(CAND, 'update-index', '--cacheinfo', f"100755,{e['oid']},{p}")

          # NC3: mutate a real gitlink OID and add a rogue tracked file; must detect changed + extra.
          gp = 'extern/taskflow'; ge = source[gp]; fake_oid = '0'*40
          git(CAND, 'update-index', '--cacheinfo', f"160000,{fake_oid},{gp}")
          rogue = CAND/'rogue.extra'; rogue.write_bytes(b'negative-control\n')
          rogue_oid = git(CAND, 'hash-object', '-w', '--stdin', input_bytes=rogue.read_bytes()).decode().strip()
          git(CAND, 'update-index', '--add', '--cacheinfo', f'100644,{rogue_oid},rogue.extra')
          nc3 = compare(read_candidate())
          nc3_ok = gp in nc3['changed'] and 'rogue.extra' in nc3['extra']
          negatives.append({'id':'NC3_GITLINK_EXTRA','expected':f'{gp} changed and rogue.extra extra','observed':nc3,'pass':nc3_ok})
          git(CAND, 'update-index', '--cacheinfo', f"160000,{ge['oid']},{gp}")
          git(CAND, 'update-index', '--force-remove', 'rogue.extra')
          rogue.unlink()

          final_candidate = read_candidate()
          restore_parity = compare(final_candidate)
          restore_ok = not any(restore_parity.values())
          negatives_ok = all(x['pass'] for x in negatives)

          result = {
              'schema':'sharck-input.sw-n46-replay-result.v2',
              'source_repo':os.environ['SOURCE_REPO'],
              'source_commit':COMMIT,
              'source_tree':tree,
              'expected_tree':EXPECTED_TREE,
              'source_count':len(source),
              'candidate_count':len(candidate),
              'missing':parity['missing'], 'extra':parity['extra'], 'changed':parity['changed'], 'mode_mismatch':parity['mode_mismatch'],
              'special_surface_errors':special_errors,
              'negative_controls':negatives,
              'negative_controls_pass':negatives_ok,
              'restore_parity':restore_parity,
              'restore_pass':restore_ok,
              'lfs_used':False,
              'canonical_write':False,
              'verdict':'PASS' if positive_ok and negatives_ok and restore_ok else 'GAP',
          }
          OUT.mkdir(parents=True, exist_ok=True)
          (OUT/'source-ledger.json').write_text(json.dumps([source[p] for p in sorted(source)],ensure_ascii=False,indent=2),encoding='utf-8',errors='surrogatepass')
          (OUT/'candidate-ledger.json').write_text(json.dumps([candidate[p] for p in sorted(candidate)],ensure_ascii=False,indent=2),encoding='utf-8',errors='surrogatepass')
          (OUT/'negative-controls.json').write_text(json.dumps(negatives,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'sw-n46-result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          if result['verdict'] != 'PASS': sys.exit(2)
          PY

      - name: Upload replay evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sw-n46-rapidfuzz-full-byte-replay
          path: /tmp/sw-n46-output
          if-no-files-found: error
          retention-days: 7
