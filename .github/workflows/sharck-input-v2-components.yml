name: Sharck Input V2 — canonical batches of 10
run-name: Sharck Input V2 • 3x10 • ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    paths:
      - '➡️📂 sharck imput/📂 input sharck code principal/📂 component acquisition/queues/**'

permissions:
  contents: write

concurrency:
  group: sharck-input-v2-component-acquisition
  cancel-in-progress: false

jobs:
  acquire:
    name: ${{ matrix.batch }} — canonical motor — 10 components
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - batch: B01
            queue: B01-web-research.json
            dest: B01-web-research
          - batch: B02
            queue: B02-ir-evidence.json
            dest: B02-ir-evidence
          - batch: B03
            queue: B03-code-runtime.json
            dest: B03-code-runtime

    env:
      DEST_REPO: maxbry123-commits/osquestador-auditor
      DEST_BRANCH: main
      DEST_ROOT: ➡️📂 sharck imput/📂 input sharck code principal/📂 componentes open source/${{ matrix.dest }}
      ENGINE_PATH: ➡️📂motores de descarga extracción copiado movimiento archivos osquestador-auditor/📂Motor descarga de componentes y extracción de zip/hf_download_extract_engine.py
      QUEUE_FILE: ➡️📂 sharck imput/📂 input sharck code principal/📂 component acquisition/queues/${{ matrix.queue }}
      STATE_FILE: ➡️📂 sharck imput/📂 input sharck code principal/📂 component acquisition/state/${{ matrix.batch }}-state.json
      INDEX_PATH: ➡️📂 sharck imput/📂 input sharck code principal/📂 component acquisition/state/${{ matrix.batch }}-INDEX.md
      MAX_RETRIES: '3'
      LOOP_SLEEP_SECONDS: '0'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Partial sparse checkout — NO LFS
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config core.sparseCheckout true
          git config core.sparseCheckoutCone false
          mkdir -p .git/info
          cat > .git/info/sparse-checkout <<'EOF'
          /.github/workflows/sharck-input-v2-components.yml
          /➡️📂 sharck imput/📂 input sharck code principal/📂 component acquisition/
          /➡️📂motores de descarga extracción copiado movimiento archivos osquestador-auditor/
          EOF
          AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          git config filter.lfs.smudge cat
          git config filter.lfs.clean cat
          git config filter.lfs.required false
          git fetch --depth=1 --filter=blob:none origin main
          git checkout -q -B main FETCH_HEAD

      - name: Verify canonical motor blob SHAs
        shell: bash
        run: |
          set -euo pipefail
          ROOT='➡️📂motores de descarga extracción copiado movimiento archivos osquestador-auditor'
          check_blob() {
            file="$1"; expected="$2"; actual="$(git hash-object "$file")"
            test "$actual" = "$expected" || { echo "MOTOR_CODE_LOCK_GAP $file expected=$expected actual=$actual"; exit 31; }
          }
          check_blob "$ROOT/➡️📂 Motor de extracción zip/motor_1_extract_only.py" a52d5dc0e6ff26f75d753b848dcc1a40c5dd4500
          check_blob "$ROOT/📂Motor descarga de componentes y extracción de zip/motor_2_queue_download_extract.py" 84d566e2ee4e98e42eb3a864026d067d48caabd9
          check_blob "$ROOT/📂Motor descarga de componentes y extracción de zip/hf_download_extract_engine.py" 91e6e4486692eab314be5c7130d8310d3c855397
          check_blob "$ROOT/➡️📂motor de copiar archivos/motor_3_copy_batches.py" 3689924361ce4a1a9fde4ae2b6f6009c37a6042d
          check_blob "$ROOT/➡️📂motor de copiar archivos/motor_copy_root_to_repo.py" 8281211da76db3080fe1f1ea38b3eb0c45d655cb
          check_blob "$ROOT/➡️📂motor de moves archivos/motor_4_move_batches.py" 9a21facfe11327cf60a2afca8f415ad52f0ecbe5

      - name: Execute canonical queue download + extraction motor
        shell: bash
        run: |
          set -euo pipefail
          python3 '➡️📂motores de descarga extracción copiado movimiento archivos osquestador-auditor/📂Motor descarga de componentes y extracción de zip/motor_2_queue_download_extract.py' \
            | tee "${{ matrix.batch }}-motor-output.jsonl"

      - name: Persist state and index
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sharck-input-watchdog'
          git config user.email 'sharck-input-watchdog@users.noreply.github.com'
          git fetch origin main
          git rebase origin/main || { git rebase --abort || true; git reset --hard origin/main; }
          mkdir -p "$(dirname "$STATE_FILE")"
          git add -- "$STATE_FILE" "$INDEX_PATH" || true
          if git diff --cached --quiet; then
            echo 'No state/index changes to persist.'
          else
            git commit -m "chore(sharck-input): persist ${{ matrix.batch }} acquisition state"
            pushed=0
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then pushed=1; break; fi
              git fetch origin main
              git rebase origin/main
            done
            test "$pushed" = 1 || { echo 'PERSISTENCE_FAILURE'; exit 42; }
          fi

      - name: Enforce canonical motor batch verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, sys
          p = pathlib.Path(os.environ['STATE_FILE'])
          if not p.exists():
              print(json.dumps({'verdict':'STATE_READBACK_GAP','state_file':str(p)}))
              sys.exit(43)
          state = json.loads(p.read_text())
          rows = list(state.get('items', {}).values())
          verified = sum(1 for r in rows if r.get('status') == 'VERIFIED_CLOSED')
          failed = sum(1 for r in rows if r.get('status') == 'FAILED')
          pending = len(rows) - verified - failed
          verdict = 'VERIFIED_CLOSED' if rows and verified == len(rows) else 'GAPS_PENDING'
          print(json.dumps({'batch': os.getenv('DEST_ROOT','').split('/')[-1], 'total':len(rows), 'verified_closed':verified, 'failed':failed, 'pending':pending, 'verdict':verdict}, sort_keys=True))
          sys.exit(0 if verdict == 'VERIFIED_CLOSED' else 44)
          PY
